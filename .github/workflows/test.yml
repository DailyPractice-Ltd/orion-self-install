name: Test

# Every push to main and every pull request, on the three kinds of machine a
# client can have.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Our files are compared byte for byte in places. Keep Windows from
      # rewriting line endings on the way in.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          # update/pristine.json is checked against everything ever shipped.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test

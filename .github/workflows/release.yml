name: Release

# A release is a CHANGELOG heading with a tag on it. Push `vX.Y.Z` (or run
# this workflow by hand with the version) and the matching "## X.Y.Z — date"
# section of CHANGELOG.md becomes the release notes. Clients never read git;
# they ask their agent "what version is my harness on?" and compare it with
# the Releases page, then say "update my harness".

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (a CHANGELOG heading, e.g. 0.5.7).'
        required: true
        type: string
      commit:
        description: 'Commit the tag should point at (sha). Leave empty to tag the current main, or if the tag already exists.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The notes come from CHANGELOG.md on main, not from the tagged
          # commit, so an old tag can be released after the fact.
          ref: main
          fetch-depth: 0

      - name: Resolve version and tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release version in X.Y.Z format." >&2
            exit 1
          fi
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            CANDIDATE="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
            CREATE_TAG=false
          else
            CANDIDATE="$(git rev-parse --verify --end-of-options "${INPUT_COMMIT:-HEAD}^{commit}")"
            CREATE_TAG=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "candidate=${CANDIDATE}" >> "$GITHUB_OUTPUT"
          echo "create_tag=${CREATE_TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate the release contract on the candidate
        env:
          CANDIDATE: ${{ steps.v.outputs.candidate }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/orion-release-candidate" "$CANDIDATE"
          cd "$RUNNER_TEMP/orion-release-candidate"
          for tool in codex claude-code; do
            echo "Checking Orion deployment for $tool at $CANDIDATE"
            node update/release-contract.mjs --tool "$tool" > /dev/null
          done

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          awk -v v="$VERSION" '
            /^## / { if (found) exit; if ($2 == v) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG.md section for ${VERSION}. Add the heading first." >&2; exit 1
          fi
          {
            echo
            echo '---'
            echo
            echo 'To move an installed harness to this version, open your Orion folder in your agent and say **update my harness**. Your knowledge base, hired agents, taught skills and status are untouched by construction; a full backup is taken first and **restore my harness from the backup** undoes it. Details: `docs/updating.md`.'
          } >> notes.md
          echo "Notes for ${VERSION}:"; cat notes.md

      - name: Push the validated tag
        if: steps.v.outputs.create_tag == 'true'
        env:
          CANDIDATE: ${{ steps.v.outputs.candidate }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          DATE="$(awk -v v="$VERSION" '/^## / && $2 == v { sub(/^## [^ ]+ — /, ""); print; exit }' CHANGELOG.md)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$CANDIDATE" -m "Orion self-install ${VERSION}${DATE:+ (${DATE})}"
          git push origin "refs/tags/${TAG}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          VERSION="${{ steps.v.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Orion self-install ${VERSION}" --notes-file notes.md
          else
            gh release create "$TAG" --title "Orion self-install ${VERSION}" --notes-file notes.md --verify-tag
          fi

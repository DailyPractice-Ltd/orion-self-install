name: Release

# Publication is an explicit maintainer action. A tag push never publishes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag (vX.Y.Z)'
        required: true
        type: string
      commit:
        description: 'Exact full 40-character candidate commit'
        required: true
        type: string
      trial_comment:
        description: 'Henri trial issue-comment ID (required for major releases or migration scripts)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish exact verified candidate
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          HENRI_GITHUB_LOGIN: ${{ vars.HENRI_GITHUB_LOGIN }}
          CANDIDATE_TAG: ${{ inputs.tag }}
          CANDIDATE_COMMIT: ${{ inputs.commit }}
          TRIAL_COMMENT: ${{ inputs.trial_comment }}
        run: |
          args=(--tag "$CANDIDATE_TAG" --commit "$CANDIDATE_COMMIT")
          if [ -n "$TRIAL_COMMENT" ]; then args+=(--trial-comment "$TRIAL_COMMENT"); fi
          node .github/scripts/publish-release.mjs "${args[@]}"

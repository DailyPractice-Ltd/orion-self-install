name: Test

# Every push to main and every pull request, on the three kinds of machine a
# client can have:
#   unit       the test suite (node --test).
#   scheduler  Legacy schedule cleanup against launchd, Task Scheduler and cron.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Our files are compared byte for byte in places. Keep Windows from
      # rewriting line endings on the way in.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
        with:
          # update/pristine.json is checked against everything ever shipped.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test

  scheduler:
    name: scheduler (${{ matrix.os }})
    # A scheduler command that hangs must not hold a machine for hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Make sure cron is running (Linux)
        if: runner.os == 'Linux'
        run: |
          command -v crontab >/dev/null || { sudo apt-get update && sudo apt-get install -y cron; }
          sudo service cron start
      - run: node tests/integration/scheduler.mjs
